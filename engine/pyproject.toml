[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellslatee-engine"
version = "0.2.1"
description = "Turn a folder of videos into a mirrored vault of study notes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shellslatee contributors" }]
keywords = ["notes", "transcription", "education", "markdown", "obsidian", "whisper"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
plugins = ["wasmtime>=21"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Tornado-Hacker/shellslatee"

[project.scripts]
shellslatee = "shellslatee_engine.cli:main"

[tool.setuptools]
packages = ["shellslatee_engine"]

[tool.setuptools.package-data]
shellslatee_engine = ["data/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
