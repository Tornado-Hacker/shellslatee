name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  rust:
    name: rust (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  dev-tools:
    name: dev tooling (python syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q scripts/dev engine/shellslatee_engine

  engine:
    name: engine (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -t . -v
      - name: wheel ships the whisper shim and imports cleanly
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import zipfile, glob, pathlib
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "shellslatee_engine/data/whisper-cli-faster.py" in names, names
          assert "shellslatee_engine/asr_setup.py" in names, names
          print("wheel contents ok:", pathlib.Path(wheel).name)
          PY
          python -m pip install --force-reinstall --no-deps dist/*.whl
          shellslatee --version
          shellslatee provision --help >/dev/null
