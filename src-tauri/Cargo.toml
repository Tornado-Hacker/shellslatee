[package]
name = "shellslatee-studio"
version = "0.3.0"
edition = "2021"
description = "Shellslatee: a local-first study cockpit with a bring-your-own-key tutor"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "5"

# DPAPI seals the API-key file to the signed-in Windows account; no passphrase,
# no plaintext secrets on disk.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
